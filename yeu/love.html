<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love</title>
    
    <link rel="stylesheet" href="stylelove.css">
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h3>ĐĂNG NHẬP ĐỂ XEM QUÀ 💕</h3>
            <form id="login-form">
                <div class="input-group">
                    <label for="username">Tài khoản (ID):</label>
                    <input type="text" id="username" placeholder="Nhập tài khoản..." required autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="password">Mật khẩu (Pass):</label>
                    <input type="password" id="password" placeholder="Nhập mật khẩu số..." required pattern="[0-9]*" inputmode="numeric">
                </div>
                <button type="submit" class="login-btn">Đăng nhập</button>
                <div id="login-error"></div>
            </form>
        </div>
    </div>
    <audio id="bg-music" src="mussic.mp3" loop></audio>

    <div id="text-container">
        <h1></h1>
        <h2></h2>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module" src="login-obfuscated.js" ></script>
    <script type="module" src="main.js"></script>
    
</body>
</html>
